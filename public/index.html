<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>4.16 시민동행 캠페인 - 별빛걷기 [노란리본의 길]</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    :root { --night-deep: #0a0f24; --night-mid: #121826; --ribbon: #ffd54a; --ink: #ece7d8; --ink-dim: #9aa0bc; }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:#000; color:var(--ink); font-family:'Noto Sans KR', sans-serif; overflow:hidden; height:100vh; display:flex; flex-direction:column; }
    
    header { padding: 14px 34px; display:flex; justify-content:space-between; align-items:center; z-index:10; background: rgba(10, 15, 36, 0.85); backdrop-filter: blur(8px); border-bottom: 1px solid rgba(255,213,74,0.2); }
    .title-box h1 { font-family:'Noto Serif KR', serif; font-size:22px; color:#ffffff; text-shadow:0 2px 4px rgba(0,0,0,0.8); margin-bottom: 2px; }
    .title-box h1 span { color: var(--ribbon); }
    .title-box p { color: #fff9d6; font-size:14px; font-weight:500; letter-spacing:-0.02em; text-shadow:0 0 8px rgba(255, 213, 74, 0.6), 0 1px 3px rgba(0,0,0,0.9); }

    .right-controls { display:flex; align-items:center; gap:20px; }
    .counter-box { text-align:right; }
    .counter-box .label { font-size:12px; color:var(--ink-dim); }
    .counter-box .count { font-size:20px; font-weight:700; color:var(--ribbon); }

    .qr-container { text-align:center; background:#fff; padding:6px; border-radius:8px; }
    .qr-container p { font-size:10px; color:#000; font-weight:700; margin-top:2px; }

    main { flex:1; position:relative; width:100%; height:100%; overflow:hidden; }
    canvas { width:100%; height:100%; display:block; }

    .delete-mode-badge { display:none; position:absolute; top:20px; left:50%; transform:translateX(-50%); background:rgba(220, 38, 38, 0.9); color:#fff; padding:8px 16px; border-radius:20px; font-size:14px; font-weight:700; z-index:20; box-shadow:0 0 15px rgba(220,38,38,0.5); }
    .delete-mode-badge.active { display:block; }

    .bottom-controls { position:absolute; bottom:20px; left:50%; transform:translateX(-50%); display:flex; gap:10px; background:rgba(10, 15, 36, 0.9); padding:10px 18px; border-radius:30px; border:1px solid rgba(255,213,74,0.3); opacity:0; transition:opacity 0.3s ease; z-index:20; }
    .bottom-controls.visible { opacity:1; }
    .bottom-controls button, .bottom-controls select { background:#121826; color:#fff; border:1px solid rgba(255,213,74,0.3); padding:6px 12px; border-radius:6px; font-size:13px; cursor:pointer; }
    .bottom-controls button:hover { background:var(--ribbon); color:#000; }
  </style>
</head>
<body>

  <header>
    <div class="title-box">
      <h1><span>4.16 시민동행 캠페인</span> - 별빛걷기 [노란리본의 길]</h1>
      <p>당신의 별빛이 노란리본의 길을 밝혀주었습니다.</p>
    </div>

    <div class="right-controls">
      <div class="counter-box">
        <div class="label">참여 현황</div>
        <div class="count"><span id="currentCount">0</span> / <span id="maxDisplay">100</span>명</div>
      </div>

      <div class="qr-container">
        <div id="qrcode"></div>
        <p>스캔하여 참여하기</p>
      </div>
    </div>
  </header>

  <main id="mainContainer">
    <div id="deleteBadge" class="delete-mode-badge">⚠️ 관리자 삭제 모드 ON (삭제할 별을 클릭하세요 - [D] 키로 해제)</div>
    <canvas id="sky"></canvas>

    <div id="bottomControls" class="bottom-controls">
      <select id="targetSelect" class="target-select">
        <option value="100" selected>목표: 100명</option>
        <option value="200">목표: 200명</option>
        <option value="300">목표: 300명</option>
      </select>
      <button id="deleteToggleBtn" class="delete-btn">별 삭제 모드 [D]</button>
      <button id="resetBtn" class="reset-btn">초기화</button>
      <button id="fullscreenBtn" class="fullscreen-btn">전체화면</button>
    </div>
  </main>

<script>
(function(){
  const socket = io();
  const canvas = document.getElementById('sky');
  const ctx = canvas.getContext('2d');
  const currentCountEl = document.getElementById('currentCount');
  const maxDisplayEl = document.getElementById('maxDisplay');
  const targetSelect = document.getElementById('targetSelect');
  const resetBtn = document.getElementById('resetBtn');
  const fullscreenBtn = document.getElementById('fullscreenBtn');
  const deleteToggleBtn = document.getElementById('deleteToggleBtn');
  const deleteBadge = document.getElementById('deleteBadge');
  const bottomControls = document.getElementById('bottomControls');
  const mainContainer = document.getElementById('mainContainer');

  // QR 코드 자동 생성
  new QRCode(document.getElementById("qrcode"), {
    text: `${window.location.origin}/mobile.html`,
    width: 60, height: 60
  });

  const mapImg = new Image(); mapImg.src = '/map.jpg';
  const leftBannerImg = new Image(); leftBannerImg.src = '/left_banner.jpg';
  const rightBannerImg = new Image(); rightBannerImg.src = '/right_banner.jpg';

  let W=0, H=0;
  let targetCount = parseInt(targetSelect.value, 10);
  let starsData = [];
  let isDeleteMode = false;
  let renderedStarCoords = [];

  const REF_W = 900;
  const REF_H = 1600;

  const BAD_WORDS = ['어묵', '창녕', '시체', '해상', '세월충', '좌빨', '북한', '이재명', '납골당', '그만해', '그만', '공산당', '그만해라', '싫어', '싫다', '싫어요'];

  function filterBadWords(text) {
    if (!text) return '별';
    const cleanText = text.replace(/\s+/g, '');
    for (let word of BAD_WORDS) {
      if (cleanText.includes(word)) return '별';
    }
    return text;
  }

  // 노란리본 경로 SVG Path
  const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  path.setAttribute('d', 'M 200,1190 C 270,1090 350,960 415,860 C 315,700 320,510 415,510 C 510,510 515,700 415,860 C 500,950 600,1020 700,1055');
  const totalPathLen = path.getTotalLength();

  function resizeCanvas() {
    W = mainContainer.clientWidth;
    H = mainContainer.clientHeight;
    canvas.width = W;
    canvas.height = H;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  // 소켓 데이터 수신 (모바일 연동 핵심)
  socket.on('initStars', (stars) => {
    starsData = stars.map(s => ({ id: s.id || Math.random(), name: filterBadWords(s.name) }));
    updateCount();
  });

  socket.on('newStar', (star) => {
    starsData.push({ id: star.id || Math.random(), name: filterBadWords(star.name) });
    updateCount();
  });

  socket.on('resetStars', () => {
    starsData = [];
    updateCount();
  });

  function updateCount() {
    currentCountEl.textContent = starsData.length;
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    if (mapImg.complete && mapImg.naturalWidth !== 0) {
      ctx.drawImage(mapImg, 0, 0, W, H);
    } else {
      ctx.fillStyle = '#0a0f24';
      ctx.fillRect(0, 0, W, H);
    }

    renderedStarCoords = [];

    starsData.forEach((star, index) => {
      const progress = (index % targetCount) / targetCount;
      const pt = path.getPointAtLength(progress * totalPathLen);

      const x = (pt.x / REF_W) * W;
      const y = (pt.y / REF_H) * H;

      renderedStarCoords.push({ id: star.id, x, y, name: star.name });

      // 별빛 빛남 효과
      ctx.beginPath();
      ctx.arc(x, y, 10, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255, 213, 74, 0.4)';
      ctx.fill();

      ctx.beginPath();
      ctx.arc(x, y, 4, 0, Math.PI * 2);
      ctx.fillStyle = '#ffd54a';
      ctx.fill();

      ctx.font = '12px "Noto Sans KR"';
      ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'center';
      ctx.fillText(star.name, x, y - 10);
    });

    requestAnimationFrame(draw);
  }
  draw();

  let hideTimer = null;
  function showControls() {
    bottomControls.classList.add('visible');
    clearTimeout(hideTimer);
    hideTimer = setTimeout(() => {
      if (!isDeleteMode) bottomControls.classList.remove('visible');
    }, 3000);
  }
  document.addEventListener('mousemove', showControls);

  targetSelect.addEventListener('change', (e) => {
    targetCount = parseInt(e.target.value, 10);
    maxDisplayEl.textContent = targetCount;
  });

  fullscreenBtn.addEventListener('click', () => {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen();
    } else {
      document.exitFullscreen();
    }
  });

  function toggleDeleteMode() {
    isDeleteMode = !isDeleteMode;
    deleteBadge.classList.toggle('active', isDeleteMode);
    deleteToggleBtn.style.background = isDeleteMode ? '#dc2626' : '#121826';
    if(isDeleteMode) bottomControls.classList.add('visible');
  }
  deleteToggleBtn.addEventListener('click', toggleDeleteMode);
  document.addEventListener('keydown', (e) => {
    if (e.key === 'd' || e.key === 'D') toggleDeleteMode();
  });

  canvas.addEventListener('click', (e) => {
    if (!isDeleteMode) return;
    const rect = canvas.getBoundingClientRect();
    const clickX = e.clientX - rect.left;
    const clickY = e.clientY - rect.top;

    renderedStarCoords.forEach(star => {
      const dist = Math.hypot(star.x - clickX, star.y - clickY);
      if (dist < 20) {
        starsData = starsData.filter(s => s.id !== star.id);
        updateCount();
      }
    });
  });

  resetBtn.addEventListener('click', () => {
    if (confirm('모든 별빛을 초기화하시겠습니까?')) {
      socket.emit('clearStars');
    }
  });

})();
</script>
</body>
</html>
